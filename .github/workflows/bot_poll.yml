name: Telegram Bot Poll

on:
  workflow_dispatch:

# Кілька запусків не перетинаються: новий чекає в черзі, поки активний loop працює
concurrency:
  group: bot-loop
  cancel-in-progress: false

jobs:
  bot-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot listener loop
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONITOR_STORE_URL: ${{ secrets.MONITOR_STORE_URL }}
          MONITOR_STORE_SECRET: ${{ secrets.MONITOR_STORE_SECRET }}
        run: python bot_listener.py --loop --max-seconds 18900


