name: Daily Garmin Check

on:
  # Єдиний тригер — cron-job.org (9:00 Kyiv). GitHub schedule прибрано:
  # його затримки + гонка кешів з bot-loop створювали дублі звітів.
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
          restore-keys: |
            garmin-state-

      - name: Run daily check
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_check.py ${{ github.event_name == 'workflow_dispatch' && '--telegram' || '' }}

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
