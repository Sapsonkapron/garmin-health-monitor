name: Daily Garmin Check

on:
  schedule:
    # 9:00 AM Kyiv time (EEST = UTC+3) → 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  daily-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/garmin_data
          key: garmin-alert-state-${{ github.run_id }}
          restore-keys: |
            garmin-alert-state-

      - name: Run daily check
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python daily_check.py --telegram

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/garmin_data
          key: garmin-alert-state-${{ github.run_id }}
