name: Evening Medication Reminder

on:
  schedule:
    # 20:00 Kyiv time (EEST = UTC+3) → 17:00 UTC (резерв; основний тригер — cron-job.org)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  med-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore med state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
          restore-keys: |
            garmin-state-

      - name: Send evening med reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python med_reminder.py

      - name: Save med state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
