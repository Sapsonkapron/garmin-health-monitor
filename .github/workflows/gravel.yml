name: Gravel Training Reminder

on:
  schedule:
    # Thursday 9:00, 12:00, 15:00 Kyiv time (EEST = UTC+3)
    # Резервні часи на випадок затримки GitHub Actions free runners
    - cron: "0 6 * * 4"
    - cron: "0 9 * * 4"
    - cron: "0 12 * * 4"
  workflow_dispatch:

jobs:
  gravel-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send gravel reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python training_reminder.py --type gravel
