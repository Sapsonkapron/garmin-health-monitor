name: Privacy Cleanup
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate 'repos/${{ github.repository }}/actions/runs?per_page=100' \
            --jq '.workflow_runs[] | select(.status == "completed") | .id' > /tmp/completed_runs
          while IFS= read -r run_id; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/runs/${run_id}"
          done < /tmp/completed_runs
          echo "Completed workflow runs removed"
