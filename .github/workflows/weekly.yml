name: Weekly Garmin Report

on:
  # Єдиний тригер — cron-job.org (неділя 18:00 Kyiv). GitHub schedule прибрано
  # (затримки + дублювання звітів).
  workflow_dispatch:

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore weekly state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
          restore-keys: |
            garmin-state-

      - name: Run weekly report
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_report.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save weekly state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/garmin_data
          key: garmin-state-${{ github.run_id }}
